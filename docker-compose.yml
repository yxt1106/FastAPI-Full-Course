services:
  app:
    image: mcr.microsoft.com/devcontainers/base:ubuntu-24.04
    working_dir: /workspaces/FastAPI-Full-Course
    command: /bin/sh -c "while sleep 1000; do :; done"
    volumes:
      - .:/workspaces/FastAPI-Full-Course:cached
    environment:
      DATABASE_URL: postgresql+psycopg://bloguser:blogdev123456@db:5432/blog
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-fastapi-blog-dev}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: bloguser
      POSTGRES_PASSWORD: blogdev123456
      POSTGRES_DB: blog
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bloguser -d blog"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
